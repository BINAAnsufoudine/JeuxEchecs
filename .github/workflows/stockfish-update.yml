name: Check stable Stockfish update

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find a stable release older than 45 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stockfish.mjs
      - name: Check JavaScript syntax
        run: node --check stockfish.js
      - name: Verify the engine starts and returns a move
        run: node scripts/check-stockfish.mjs
      - name: Open an update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: codex/update-stockfish-stable
          delete-branch: true
          title: 'Update stable Stockfish.js engine'
          commit-message: 'Update stable Stockfish.js engine'
          body: |
            This update uses the latest Stockfish.js stable release that has been available for at least 45 days.

            The workflow checks the browser engine and verifies that it answers UCI and returns a move before opening this pull request.
