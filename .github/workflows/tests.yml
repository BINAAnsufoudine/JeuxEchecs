name: Tests

# À chaque envoi sur main et à chaque PR : syntaxe de tous les scripts, tests du moteur et de la 3D, démarrage de l'appli
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier que app.js et board3d.js correspondent à leurs modules (src/)
        run: node scripts/build.mjs --check
      - name: Vérifier la syntaxe de tous les scripts
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: Installer Playwright et Chromium
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Lancer le serveur local
        run: python3 -m http.server 8765 &
      - name: Tests dans le navigateur
        run: node scripts/run-tests.mjs
